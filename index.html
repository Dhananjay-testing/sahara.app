<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahara HRMS</title>
    <link rel="manifest" href="manifest.json">
    <!-- Tailwind CSS for modern mobile UI -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <nav class="bg-gray-800 border-b border-gray-700 px-4 py-3 flex justify-between items-center shadow-md">
        <span class="text-xl font-bold tracking-wider text-teal-400">Sahara HRMS</span>
        <button id="logoutBtn" class="hidden text-sm bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded transition font-medium">Logout</button>
    </nav>

    <!-- Main Dynamic Content Wrapper -->
    <main class="flex-grow container mx-auto px-4 py-6 max-w-md">
        
        <!-- Screen 1: Auth (Login/Signup) -->
        <section id="authScreen" class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700 mt-10">
            <h2 class="text-2xl font-bold mb-6 text-center text-white" id="authTitle">Sign In</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">Email Address</label>
                    <input type="email" id="emailInput" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-teal-500">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">Password</label>
                    <input type="password" id="passwordInput" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-teal-500">
                </div>
                <button id="authPrimaryBtn" class="w-full bg-teal-500 hover:bg-teal-600 text-gray-900 font-bold py-2.5 rounded-lg transition mt-2 shadow-lg">Login</button>
                <p class="text-center text-xs text-gray-400 mt-4">
                    <span id="authToggleText">Need an account?</span> 
                    <button id="authToggleBtn" class="text-teal-400 font-semibold hover:underline ml-1">Create one</button>
                </p>
            </div>
        </section>

        <!-- Screen 2: Employee Portal -->
        <section id="employeeScreen" class="hidden space-y-6">
            <!-- Punch Card Component -->
            <div class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700 text-center">
                <h3 class="text-xs uppercase tracking-widest text-gray-400 mb-1 font-bold">Attendance Desk</h3>
                <p id="liveClock" class="text-3xl font-extrabold text-white my-2">00:00:00</p>
                <div class="grid grid-cols-2 gap-3 mt-4">
                    <button id="punchInBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg">Check In</button>
                    <button id="punchOutBtn" class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl transition shadow-lg" disabled>Check Out</button>
                </div>
                <p id="punchStatus" class="text-xs text-gray-400 mt-3 italic">Not checked in today</p>
            </div>

            <!-- Leave Request Component -->
            <div class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700">
                <h3 class="text-lg font-bold text-white mb-4">Request Leave</h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-gray-400 font-medium mb-1">Date</label>
                        <input type="date" id="leaveDate" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 font-medium mb-1">Reason</label>
                        <textarea id="leaveReason" rows="2" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-3 py-2 text-white focus:outline-none resize-none" placeholder="Sick leave, vacation..."></textarea>
                    </div>
                    <button id="submitLeaveBtn" class="w-full bg-gray-700 hover:bg-gray-600 text-teal-400 border border-teal-500/30 font-bold py-2 rounded-lg transition">Submit Application</button>
                </div>
            </div>
        </section>

        <!-- Screen 3: Admin Dashboard -->
        <section id="adminScreen" class="hidden space-y-6">
            <div class="bg-gray-800 p-6 rounded-2xl shadow-xl border border-gray-700">
                <h3 class="text-xl font-bold text-white mb-4">Admin Dashboard</h3>
                <div class="border-b border-gray-700 pb-4 mb-4">
                    <h4 class="text-xs uppercase font-bold tracking-wider text-teal-400 mb-2">Today's Attendance</h4>
                    <div id="adminAttendanceList" class="space-y-2 text-sm text-gray-300">
                        <p class="italic text-gray-500">No punch records found.</p>
                    </div>
                </div>
                <div>
                    <h4 class="text-xs uppercase font-bold tracking-wider text-amber-400 mb-2">Pending Leave Requests</h4>
                    <div id="adminLeaveList" class="space-y-2 text-sm text-gray-300">
                        <p class="italic text-gray-500">No pending requests.</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- App Engine Connectivity Scripts -->
    <script type="module" src="app.js"></script>
</body>
</html>
